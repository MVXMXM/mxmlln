name: Bump folio version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # The bump commit is also a push to main. Skipping it stops the version from climbing on its own.
    if: "${{ !startsWith(github.event.head_commit.message, 'Folio: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: node scripts/bump-folio-version.mjs
      - name: Commit the patch bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add folio-version.json
          git commit -m "Folio: bump version"
          git push origin HEAD:main
